<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Couleurs de la charte (tokens de src/styles/config/_variables.scss) : fichier autonome, il ne peut pas lire les variables CSS du site. -->
  <rect width="32" height="32" rx="7" fill="#748a70" />
  <g fill="#f7f5f0" stroke="#f7f5f0" stroke-linecap="round" stroke-linejoin="round">
    <!-- cordon de suspension -->
    <path d="M10 8.5 16 4.5l6 4" fill="none" stroke-width="1.8" />
    <!-- barre de bois -->
    <rect x="4.5" y="8" width="23" height="3.4" rx="1.7" stroke="none" />
    <!-- corps de la tenture, avec son V de nœuds en creux -->
    <path d="M8 11.5h16V18l-8 7-8-7z" stroke="none" />
    <path d="M11.5 14.5 16 19l4.5-4.5" fill="none" stroke="#748a70" stroke-width="2" />
    <!-- frange -->
    <path d="M11 21v6.5M16 25v4.5M21 21v6.5" fill="none" stroke-width="2" />
  </g>
</svg>
